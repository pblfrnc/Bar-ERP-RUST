[package]
name = "barerp-app"
description = "BarERP Pro — aplicativo nativo do caixa (Slint, sem webview)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "barerp"
path = "src/main.rs"

[dependencies]
barerp-backup = { path = "../barerp-backup" }
barerp-catalog = { path = "../barerp-catalog" }
barerp-core = { path = "../barerp-core" }
barerp-db = { path = "../barerp-db" }
barerp-fiscal = { path = "../barerp-fiscal" }
barerp-license = { path = "../barerp-license" }
barerp-menu-publish = { path = "../barerp-menu-publish" }
barerp-print = { path = "../barerp-print" }
barerp-report = { path = "../barerp-report" }
barerp-server = { path = "../barerp-server" }
barerp-updater = { path = "../barerp-updater" }
chrono = "0.4.39"
dirs = "5.0.1"
# Diálogo nativo de abrir/salvar arquivo (foto do produto, PDF da folha de balanço)
rfd = "0.15.1"
serde = { version = "1.0.217", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1.0.135"
slint = "1.9.2"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.9.2"
# Ícone e versão dentro do barerp.exe (só no alvo Windows)
embed-resource = "3.0.12"

[dev-dependencies]
png = "0.17.16"
# Renderização por software com as fontes do sistema: prints das telas sem abrir janela
slint = { version = "1.9.2", features = ["renderer-software", "software-renderer-systemfonts"] }
