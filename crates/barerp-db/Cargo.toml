[package]
name = "barerp-db"
description = "Acesso ao banco SQLite do BarERP (compatível com o bar.db criado pelo Prisma)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
barerp-core = { path = "../barerp-core" }
chrono = { version = "0.4.39", features = ["serde"] }
quick-xml = "0.37.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
