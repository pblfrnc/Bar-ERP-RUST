[package]
name = "barerp-license"
description = "Licença do BarERP: ID da máquina (igual ao node-machine-id), chave offline e painel de licenças no Render"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
barerp-db = { path = "../barerp-db" }
chrono = "0.4.39"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.11"
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["full"] }
wiremock = "0.6.2"
